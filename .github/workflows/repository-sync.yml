name: Sync to Checkmarx Repository

on:
  workflow_call:
    inputs:
      target_repo:
        description: "Destination repository name"
        required: true
        type: string

    secrets:
      SYNC_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: sync-checkmarx-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_ORG: acacoop
      TARGET_BRANCH: main
      # Todo lo que venga de contexto de GitHub se vuelca acá y se referencia
      # como $VAR en los steps, nunca como ${{ }} directo dentro de run:.
      SOURCE_REPO: ${{ github.repository }}
      SOURCE_BRANCH: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
      RUN_ID: ${{ github.run_id }}
      TARGET_REPO_INPUT: ${{ inputs.target_repo }}

    steps:

      - name: Validate target_repo input
        run: |
          # Whitelist estricta: letras, números, guiones, puntos y guión bajo.
          # Corta cualquier intento de inyección vía nombre de repo.
          if ! [[ "$TARGET_REPO_INPUT" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::target_repo inválido: '$TARGET_REPO_INPUT'"
            exit 1
          fi
          echo "target_repo validado: $TARGET_REPO_INPUT"

      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Print execution context
        run: |
          echo "Source repository: $SOURCE_REPO"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Source commit: $SOURCE_SHA"
          echo "Actor: $ACTOR"
          echo "Workflow run ID: $RUN_ID"
          echo "Target organization: $TARGET_ORG"
          echo "Target repository: $TARGET_REPO_INPUT"
          echo "Target branch: $TARGET_BRANCH"
          date -u

      - name: Clone target repository
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # El token nunca se pisa en la URL: se pasa vía extraheader de git
          # config, así no queda expuesto en mensajes de error de git ni en
          # el remote configurado del repo clonado.
          git clone "https://github.com/${TARGET_ORG}/${TARGET_REPO_INPUT}.git" /tmp/sync-repo
          cd /tmp/sync-repo

          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${SYNC_TOKEN}" | base64 -w0)"

          git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH"

      - name: Dry-run sync (preview de cambios)
        run: |
          # Muestra qué se va a borrar/modificar antes de tocar nada,
          # queda en el log del job para poder auditarlo.
          echo "===== RSYNC DRY-RUN ====="
          rsync -av --delete --dry-run \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.checkmarx-sync' \
            ./ /tmp/sync-repo/

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.checkmarx-sync' \
            ./ /tmp/sync-repo/

      - name: Generate sync metadata
        run: |
          {
            echo "Source Repository: $SOURCE_REPO"
            echo "Source Commit: $SOURCE_SHA"
            echo "Source Author: $ACTOR"
            echo "Source Commit URL: https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA"
            echo "Workflow Run URL: https://github.com/$SOURCE_REPO/actions/runs/$RUN_ID"
            echo "Target Repository: $TARGET_ORG/$TARGET_REPO_INPUT"
            echo "Target Branch: $TARGET_BRANCH"
            echo "Sync Timestamp UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > /tmp/sync-repo/.checkmarx-sync

          echo "Metadata file generated:"
          cat /tmp/sync-repo/.checkmarx-sync

      - name: Commit and push changes
        run: |
          cd /tmp/sync-repo

          git config user.name "security-sync-bot"
          git config user.email "security-sync-bot@acacoop.com.ar"

          echo "===== FILES IN TARGET REPO ====="
          ls -la

          echo "===== CHECK IF METADATA IS IGNORED ====="
          git check-ignore -v .checkmarx-sync || true

          git add -A

          echo "===== GIT STATUS ====="
          git status

          echo "===== STAGED FILES ====="
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          COMMIT_URL="https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA"
          WORKFLOW_RUN_URL="https://github.com/$SOURCE_REPO/actions/runs/$RUN_ID"

          git commit -m "Sync | Repo=$SOURCE_REPO | Commit=$SOURCE_SHA | Author=$ACTOR" \
                     -m "Source commit: $COMMIT_URL" \
                     -m "Workflow run: $WORKFLOW_RUN_URL"

          echo "Rebasing with latest target branch before push..."
          git pull --rebase origin "$TARGET_BRANCH"

          echo "Pushing changes to target repository..."
          git push origin "$TARGET_BRANCH"

      - name: Show final target repository status
        run: |
          cd /tmp/sync-repo

          echo "===== LAST COMMIT ====="
          git log -1 --oneline

          echo "===== FINAL STATUS ====="
          git status
