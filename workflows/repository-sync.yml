name: Sync to Checkmarx Repository

on:
  workflow_call:
    inputs:
      target_repo:
        description: "Destination repository name"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      TARGET_ORG: acacoop
      TARGET_BRANCH: main

    steps:

      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Clone target repository
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${SYNC_TOKEN}@github.com/${TARGET_ORG}/${{ inputs.target_repo }}.git \
            /tmp/sync-repo

          cd /tmp/sync-repo

          git checkout ${TARGET_BRANCH} || git checkout -b ${TARGET_BRANCH}

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.checkmarx-sync' \
            ./ /tmp/sync-repo/

      - name: Commit and push
        run: |
          cd /tmp/sync-repo

          git config user.name "security-sync-bot"
          git config user.email "security-sync-bot@acacoop.com.ar"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"

          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"

          cat > .checkmarx-sync << EOF
Source Repository: ${REPO}
Source Commit: ${SHA}
Source Author: ${ACTOR}
Source Commit URL: ${COMMIT_URL}
Sync Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")
EOF

          git add -A

          git commit -m "Sync | Repo=${REPO} | Commit=${SHA} | Author=${ACTOR} | ${COMMIT_URL}"

          git push origin ${TARGET_BRANCH}
